name: Mettre à jour le flux KDNuggets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer feedparser
        run: pip install feedparser

      - name: Récupérer les articles, tags et images
        run: |
          mkdir -p data

          python - <<'PY'
          import feedparser
          import html
          import json
          import re
          from datetime import datetime


          def extract_image_from_html(content):
              """Extrait la première URL d'image présente dans du HTML."""
              if not content:
                  return ""

              content = html.unescape(content)

              match = re.search(
                  r'''<img[^>]+src\s*=\s*["']([^"']+)["']''',
                  content,
                  flags=re.IGNORECASE
              )

              return match.group(1) if match else ""


          def get_image(entry):
              """Récupère l'image associée à un article RSS."""

              media_content = entry.get("media_content", [])
              for media in media_content:
                  if media.get("url"):
                      return media["url"]

              media_thumbnail = entry.get("media_thumbnail", [])
              for media in media_thumbnail:
                  if media.get("url"):
                      return media["url"]

              image = entry.get("image", {})
              if isinstance(image, dict) and image.get("href"):
                  return image["href"]

              content_list = entry.get("content", [])
              for content in content_list:
                  image_url = extract_image_from_html(
                      content.get("value", "")
                  )

                  if image_url:
                      return image_url

              return extract_image_from_html(entry.get("summary", ""))


          def get_tags(entry):
              """Récupère tous les tags attribués à un article KDNuggets."""
              tags = []
              seen = set()

              for tag in entry.get("tags", []):
                  name = tag.get("term", "").strip()
                  normalized_name = name.lower()

                  if name and normalized_name not in seen:
                      tags.append(name)
                      seen.add(normalized_name)

              return tags


          feed_url = "https://www.kdnuggets.com/feed"
          feed = feedparser.parse(feed_url)

          if feed.bozo and not feed.entries:
              raise RuntimeError(
                  f"Impossible de récupérer le flux : {feed.bozo_exception}"
              )

          articles = []

          for entry in feed.entries[:9]:
              published = entry.get("published_parsed")

              if published:
                  date = datetime(
                      published.tm_year,
                      published.tm_mon,
                      published.tm_mday
                  ).strftime("%d/%m/%Y")
              else:
                  date = ""

              articles.append({
                  "title": entry.get("title", "Article sans titre"),
                  "link": entry.get(
                      "link",
                      "https://www.kdnuggets.com/"
                  ),
                  "date": date,
                  "tags": get_tags(entry),
                  "image": get_image(entry)
              })

          with open(
              "data/kdnuggets.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  articles,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"{len(articles)} article(s) enregistré(s).")
          PY

      - name: Enregistrer les nouveautés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/kdnuggets.json

          if git diff --cached --quiet; then
            echo "Aucune mise à jour à enregistrer."
          else
            git commit -m "Mise à jour du flux KDNuggets"
            git push
          fi
