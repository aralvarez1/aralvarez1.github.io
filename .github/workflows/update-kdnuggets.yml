name: Mettre à jour le flux KDNuggets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser requests

      - name: Récupérer les articles, images et tags
        run: |
          mkdir -p data

          python - <<'PY'
          import feedparser
          import json
          import re
          import requests
          from datetime import datetime
          from urllib.parse import urlparse


          FEED_URL = "https://www.kdnuggets.com/feed"
          API_URL = "https://www.kdnuggets.com/wp-json/wp/v2/posts"

          # Tags à ne jamais afficher sur le portfolio.
          EXCLUDED_TAGS = {
              "originals"
          }


          def get_slug(article_url):
              """Extrait le slug WordPress depuis l'URL de l'article."""
              path = urlparse(article_url).path.strip("/")

              if not path:
                  return ""

              return path.split("/")[-1]


          def get_image(entry):
              """Récupère l'image déclarée dans le flux RSS."""
              media_content = entry.get("media_content", [])

              for media in media_content:
                  if media.get("url"):
                      return media["url"]

              media_thumbnail = entry.get("media_thumbnail", [])

              for media in media_thumbnail:
                  if media.get("url"):
                      return media["url"]

              return ""


          def clean_html(value):
              """Supprime les balises HTML éventuelles d'un libellé."""
              text = re.sub(r"<[^>]+>", "", value or "")
              return " ".join(text.split()).strip()


          def get_wordpress_tags(article_url):
              """
              Récupère les catégories et tags natifs de l'article via l'API
              WordPress de KDNuggets, en excluant les libellés non pertinents.
              """
              slug = get_slug(article_url)

              if not slug:
                  return []

              try:
                  response = requests.get(
                      API_URL,
                      params={
                          "slug": slug,
                          "_embed": "true"
                      },
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 "
                              "(compatible; ArthurPortfolio/1.0)"
                          )
                      },
                      timeout=20
                  )

                  response.raise_for_status()
                  posts = response.json()

                  if not posts:
                      print(f"Aucun article API trouvé pour : {slug}")
                      return []

                  embedded = posts[0].get("_embedded", {})
                  terms_groups = embedded.get("wp:term", [])

                  tags = []
                  seen = set()

                  for terms_group in terms_groups:
                      for term in terms_group:
                          taxonomy = term.get("taxonomy", "")

                          # L'API WordPress utilise généralement ces deux types.
                          if taxonomy not in ["category", "post_tag"]:
                              continue

                          term_name = clean_html(term.get("name", ""))
                          normalized_name = term_name.lower()

                          if (
                              term_name
                              and normalized_name not in seen
                              and normalized_name not in EXCLUDED_TAGS
                          ):
                              tags.append(term_name)
                              seen.add(normalized_name)

                  return tags[:4]

              except requests.RequestException as error:
                  print(f"API WordPress indisponible pour {slug} : {error}")
                  return []

              except (ValueError, KeyError, TypeError) as error:
                  print(f"Réponse API invalide pour {slug} : {error}")
                  return []


          feed = feedparser.parse(FEED_URL)

          if feed.bozo and not feed.entries:
              raise RuntimeError(
                  "Impossible de récupérer le flux KDNuggets : "
                  f"{feed.bozo_exception}"
              )

          articles = []

          for entry in feed.entries[:9]:
              article_url = entry.get(
                  "link",
                  "https://www.kdnuggets.com/"
              )

              published = entry.get("published_parsed")

              if published:
                  date = datetime(
                      published.tm_year,
                      published.tm_mon,
                      published.tm_mday
                  ).strftime("%d/%m/%Y")
              else:
                  date = ""

              articles.append({
                  "title": entry.get("title", "Article sans titre"),
                  "link": article_url,
                  "date": date,
                  "tags": get_wordpress_tags(article_url),
                  "image": get_image(entry)
              })

          with open(
              "data/kdnuggets.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  articles,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"{len(articles)} article(s) enregistré(s).")
          PY

      - name: Enregistrer les nouveautés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/kdnuggets.json

          if git diff --cached --quiet; then
            echo "Aucune mise à jour à enregistrer."
          else
            git commit -m "Mise à jour du flux KDNuggets"
            git push
          fi
